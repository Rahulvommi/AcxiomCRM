<!DOCTYPE html>
<html>
<head>

    <title>Add Lead - AcxiomCRM</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto"
         style="max-width:700px;">

        <div class="card-body p-4">

            <h3 class="mb-4">
                Add Lead
            </h3>


            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Lead Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required
                        maxlength="100">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Source
                    </label>

                    <input
                        type="text"
                        name="source"
                        class="form-control"
                        placeholder="Website, Referral, Campaign...">

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="New">
                                New
                            </option>

                            <option value="Contacted">
                                Contacted
                            </option>

                            <option value="Qualified">
                                Qualified
                            </option>

                            <option value="Unqualified">
                                Unqualified
                            </option>

                            <option value="Converted">
                                Converted
                            </option>

                            <option value="Lost">
                                Lost
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Priority
                        </label>

                        <select
                            name="priority"
                            class="form-select">

                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium" selected>
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>

                        </select>

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Expected Value
                    </label>

                    <input
                        type="number"
                        name="expected_value"
                        class="form-control"
                        min="0"
                        step="0.01"
                        value="0">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Lead

                </button>


                <a
                    href="{% url 'lead_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
