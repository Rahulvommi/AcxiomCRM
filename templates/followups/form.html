<!DOCTYPE html>
<html>
<head>

    <title>Add Follow-Up - AcxiomCRM</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto"
         style="max-width:750px;">

        <div class="card-body p-4">

            <h3 class="mb-4">
                Add Follow-Up
            </h3>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Subject *
                    </label>

                    <input
                        type="text"
                        name="subject"
                        class="form-control"
                        maxlength="150"
                        required>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Date *
                        </label>

                        <input
                            type="date"
                            name="date"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Type
                        </label>

                        <select
                            name="type"
                            class="form-select">

                            <option value="Call">Call</option>
                            <option value="Email">Email</option>
                            <option value="Meeting">Meeting</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Customer
                    </label>

                    <select
                        name="customer"
                        class="form-select">

                        <option value="">
                            None
                        </option>

                        {% for customer in customers %}

                        <option value="{{ customer.id }}">
                            {{ customer.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Lead
                    </label>

                    <select
                        name="lead"
                        class="form-select">

                        <option value="">
                            None
                        </option>

                        {% for lead in leads %}

                        <option value="{{ lead.id }}">
                            {{ lead.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Opportunity
                    </label>

                    <select
                        name="opportunity"
                        class="form-select">

                        <option value="">
                            None
                        </option>

                        {% for opportunity in opportunities %}

                        <option value="{{ opportunity.id }}">
                            {{ opportunity.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Planned">
                            Planned
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Missed">
                            Missed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Notes
                    </label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Follow-Up

                </button>

                <a
                    href="{% url 'followup_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
