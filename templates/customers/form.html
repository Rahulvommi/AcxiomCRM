<!DOCTYPE html>
<html>
<head>
    <title>Add Customer - AcxiomCRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm border-0 mx-auto"
         style="max-width:700px;">

        <div class="card-body p-4">

            <h3 class="mb-4">Add Customer</h3>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required
                        maxlength="100">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>

                    <input
                        type="tel"
                        name="phone"
                        class="form-control"
                        required
                        maxlength="20">
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>

                    <select name="status" class="form-select">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Notes</label>

                    <textarea
                        name="notes"
                        class="form-control"
                        rows="3"></textarea>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Save Customer
                </button>

                <a href="{% url 'customer_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
